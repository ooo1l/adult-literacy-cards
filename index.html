try{index=parseInt(localStorage.getItem("literacySafariIndex")||"0",10)||0;marks=JSON.parse(localStorage.getItem("literacySafariMarks")||"{}")}catch(e){}

var card=document.getElementById("card"),word=document.getElementById("word"),meaning=document.getElementById("meaning");
function save(){try{localStorage.setItem("literacySafariIndex",String(index));localStorage.setItem("literacySafariMarks",JSON.stringify(marks))}catch(e){}}
function render(){renderPicture();flipped=false;word.className="word";meaning.className="meaning hidden";word.textContent=cards[index][0];meaning.textContent=cards[index][1];document.getElementById("count").textContent=(index+1)+" / "+cards.length;document.getElementById("progress").style.width=((index+1)/cards.length*100)+"%";document.getElementById("status").textContent=marks[index]==="yes"?"已标记：✓ 认识":marks[index]==="no"?"已标记：× 不认识":"";save()}

function stopSpeech(){speechToken++;if("speechSynthesis" in window)window.speechSynthesis.cancel();currentSpeech=null;speechStatus.textContent="";speakButton.textContent=flipped?"🔊 朗读解释":"🔊 朗读词语"}
var originalRender=render;render=function(){stopSpeech();originalRender();speakButton.textContent="🔊 朗读词语"};
speakButton.addEventListener("click",function(){
 if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){speechStatus.textContent="当前浏览器不支持朗读，请用 Safari 打开";return}
 stopSpeech();var token=speechToken,u=new SpeechSynthesisUtterance(cards[index][flipped?1:0]);currentSpeech=u;u.lang="zh-CN";u.rate=0.8;
 var voices=window.speechSynthesis.getVoices(),voice=voices.filter(function(v){return /^zh[-_]CN$/i.test(v.lang)})[0]||voices.filter(function(v){return /^zh/i.test(v.lang)})[0];if(voice)u.voice=voice;
 u.onstart=function(){if(token===speechToken){speechStatus.textContent="正在朗读…"}};
 u.onend=function(){if(token===speechToken){speechStatus.textContent="";currentSpeech=null}};
 u.onerror=function(e){if(token===speechToken&&e.error!=="canceled"&&e.error!=="interrupted"){speechStatus.textContent="朗读未能播放，请检查音量后重试";currentSpeech=null}};
 window.speechSynthesis.speak(u);
});

function go(d){index=Math.max(0,Math.min(cards.length-1,index+d));render()}

html,body{margin:0;min-height:100%;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#111}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:560px;margin:0 auto;padding:22px 18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:22px;font-weight:700}.count{color:#666}
.track{height:6px;background:#ddd;border-radius:8px;overflow:hidden;margin-bottom:20px}.progress{height:100%;background:#111;transition:width .2s}
.card{flex-direction:column;gap:18px;height:430px;max-height:55vh;min-height:330px;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-shadow:0 7px 25px rgba(0,0,0,.08);touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:pointer}
.word{font-size:clamp(44px,13vw,68px);font-weight:750;letter-spacing:.05em}.meaning{font-size:29px;line-height:1.55}.hidden{display:none}
.help{text-align:center;color:#777;font-size:14px;margin:14px 0 17px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:13px}button{min-height:54px;border:0;border-radius:17px;background:#fff;font-size:19px;font-weight:650;box-shadow:0 2px 10px rgba(0,0,0,.06);color:#111}.no{background:#fdeaea}.yes{background:#e6f6ea}
.status{text-align:center;height:25px;color:#666;font-size:14px;margin-top:10px}.nav{display:flex;justify-content:space-between;gap:12px}.nav button{min-height:46px;padding:0 18px;font-size:16px}
.picture{width:210px;height:155px;flex-shrink:0}.picture svg{width:100%;height:100%}.meaning{font-size:25px}@media(max-height:740px){.app{padding-top:12px}.card{min-height:270px;max-height:48vh;padding:18px;gap:12px}.picture{width:170px;height:120px}.help{margin:10px 0}.word{font-size:50px}}
